name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  dashboard-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: dashboard/server/package-lock.json

      - name: Install server dependencies
        run: cd dashboard/server && npm ci

      - name: TypeScript type check (server)
        run: cd dashboard/server && npx tsc --noEmit

      - name: Build server
        run: cd dashboard/server && npm run build 2>/dev/null || npx tsc

  test:
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Tests target the public demo site (same as local .env / configs/sites/the-internet.yaml).
      # example-flow.spec.ts is excluded: it is a copy-me template hitting /some-feature,
      # which exists on no real target, so it can never pass in CI.
      - name: Run tests
        run: npx playwright test tests/common/login.spec.ts tests/flows/checkboxes.spec.ts tests/flows/dropdown.spec.ts tests/flows/dynamic-controls.spec.ts
        env:
          BASE_URL: https://the-internet.herokuapp.com
          LOGIN_PATH: /login
          EMAIL_SELECTOR: '[name="username"]'
          PASSWORD_SELECTOR: '[name="password"]'
          SUBMIT_SELECTOR: 'button[type="submit"]'
          SLOW_API_THRESHOLD_MS: 3000
          TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'tomsmith' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'SuperSecretPassword!' }}
